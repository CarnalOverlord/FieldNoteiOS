workflows:
  fieldnote-testflight:
    name: FieldNote TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic JBL Vendor
    environment:
      ios_signing:
        provisioning_profiles:
          - fieldnote_app_store_app_groups
          - fieldnote_widget_app_store
        certificates:
          - "JBL Vendor Distribution"
      xcode: latest
    scripts:
      - name: Apply App Store provisioning profile
        script: xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly":true}'
      - name: Build signed IPA
        script: |
          set -e
          case "${BUILD_NUMBER:-}" in
            ''|*[!0-9]*) echo "Codemagic BUILD_NUMBER is missing or invalid: ${BUILD_NUMBER:-unset}"; exit 1 ;;
          esac
          BUILD_VERSION=$((BUILD_NUMBER + 15))
          echo "Building FieldNote version 1.0 ($BUILD_VERSION) from Codemagic build $BUILD_NUMBER"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/FieldNote.xcodeproj" \
            --scheme FieldNote \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CURRENT_PROJECT_VERSION=$BUILD_VERSION"

          IPA_INFO_PLIST=$(mktemp)
          trap 'rm -f "$IPA_INFO_PLIST"' EXIT
          unzip -p "$CM_BUILD_DIR/build/ios/ipa/FieldNote.ipa" Payload/FieldNote.app/Info.plist > "$IPA_INFO_PLIST"
          IPA_BUILD_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$IPA_INFO_PLIST")
          echo "Exported IPA CFBundleVersion: $IPA_BUILD_VERSION (expected $BUILD_VERSION)"
          if [ "$IPA_BUILD_VERSION" != "$BUILD_VERSION" ]; then
            echo "Exported IPA version does not match the selected App Store build number"
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

