workflows:
  fieldnote-testflight:
    name: FieldNote TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic JBL Vendor
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: co.za.drkflm.fieldnote
      xcode: latest
    scripts:
      - name: Set unique iOS build number
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          BUILD_VERSION="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-6}}"
          if [ "$BUILD_VERSION" -le 5 ]; then BUILD_VERSION=6; fi
          agvtool new-version -all "$BUILD_VERSION"
          echo "Set FieldNote build number to $BUILD_VERSION"
      - name: Apply App Store provisioning profile
        script: xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly":true}'
      - name: Build signed IPA
        script: xcode-project build-ipa --project "$CM_BUILD_DIR/FieldNote.xcodeproj" --scheme FieldNote
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal

