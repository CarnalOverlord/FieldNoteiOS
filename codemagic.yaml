workflows:
  fieldnote-testflight:
    name: FieldNote TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic JBL Vendor
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: co.za.drkflm.fieldnote
      xcode: latest
    scripts:
      - name: Set unique iOS build number
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          BUILD_VERSION="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-}}"
          if [ -z "$BUILD_VERSION" ]; then
            echo "ERROR: Codemagic did not provide PROJECT_BUILD_NUMBER or BUILD_NUMBER; refusing to reuse a build number."
            exit 1
          fi
          case "$BUILD_VERSION" in
            *[!0-9]*|"")
              echo "ERROR: Codemagic build number is not a positive integer: $BUILD_VERSION"
              exit 1
              ;;
          esac
          if [ "$BUILD_VERSION" -le 6 ]; then BUILD_VERSION=7; fi
          agvtool new-version -all "$BUILD_VERSION"
          echo "Set FieldNote build number to $BUILD_VERSION (previously used builds through 6)"
      - name: Apply App Store provisioning profile
        script: xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly":true}'
      - name: Build signed IPA
        script: xcode-project build-ipa --project "$CM_BUILD_DIR/FieldNote.xcodeproj" --scheme FieldNote
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal

